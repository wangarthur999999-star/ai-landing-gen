<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: page_title --></title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --yellow: #ffed00; --pink: #ff2d78; --cyan: #00e5ff; --purple: #7c3aed;
    --bg: #f8f8f0; --text: #1a1a1a;
  }
  body {
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .hero {
    padding: 6rem 2rem; text-align: center;
    background: var(--yellow);
    border-bottom: 6px solid #1a1a1a;
  }
  h1 { font-size: clamp(3rem, 8vw, 5rem); font-weight: 900; line-height: 1; text-transform: uppercase; letter-spacing: -0.03em; }
  .badge {
    display: inline-block; background: #1a1a1a; color: var(--yellow); padding: 0.5rem 1.5rem;
    font-weight: 700; font-size: 0.875rem; text-transform: uppercase; margin-bottom: 2rem;
    box-shadow: 4px 4px 0 #666;
  }
  .cta {
    display: inline-block; background: var(--pink); color: #fff; padding: 1.25rem 3rem;
    font-size: 1.25rem; font-weight: 800; text-decoration: none; text-transform: uppercase;
    box-shadow: 6px 6px 0 #1a1a1a; border: 3px solid #1a1a1a;
    transition: box-shadow 0.15s, transform 0.15s; margin-top: 2rem;
  }
  .cta:hover { box-shadow: 3px 3px 0 #1a1a1a; transform: translate(3px, 3px); }
  .section { padding: clamp(3rem, 8vw, 6rem) 2rem; }
  .section h2 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 3rem; }
  .features {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 2rem;
  }
  .feature-card {
    background: #fff; border: 3px solid #1a1a1a; padding: 2rem;
    box-shadow: 6px 6px 0 #1a1a1a; transition: box-shadow 0.15s, transform 0.15s;
  }
  .feature-card:hover { box-shadow: 3px 3px 0 #1a1a1a; transform: translate(3px, 3px); }
  .feature-card h3 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; text-transform: uppercase; }
  .feature-card p { color: #555; line-height: 1.7; }
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
  .price-card {
    background: #fff; border: 3px solid #1a1a1a; padding: 2.5rem;
    box-shadow: 6px 6px 0 #1a1a1a; text-align: center;
  }
  .price-card.featured { background: var(--cyan); }
  .price-card h3 { font-size: 1.5rem; font-weight: 800; text-transform: uppercase; }
  .price-card .price { font-size: 3rem; font-weight: 900; margin: 1.5rem 0; }
  .rainbow-bg {
    background: linear-gradient(135deg, var(--yellow) 0%, var(--pink) 50%, var(--cyan) 100%);
  }
  .testimonials { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
  .testimonial-card {
    background: #fff; border: 3px solid #1a1a1a; padding: 2rem;
    box-shadow: 6px 6px 0 #1a1a1a;
  }
  .testimonial-card p { font-size: 1.125rem; color: #333; margin-bottom: 1rem; font-style: italic; }
  .testimonial-card cite { font-weight: 800; text-transform: uppercase; }
  footer {
    background: #1a1a1a; color: #fff; padding: 3rem 2rem;
    text-align: center; font-weight: 700; font-size: 0.875rem;
    border-top: 6px solid var(--yellow);
  }
</style>
</head>
<body>
<section class="hero">
  <div class="badge"><!-- SLOT: badge_text --></div>
  <h1><!-- SLOT: hero_headline --></h1>
  <p style="font-size:1.25rem;max-width:32rem;margin:1.5rem auto;color:#333"><!-- SLOT: hero_subtitle --></p>
  <a href="#" class="cta"><!-- SLOT: cta_text --></a>
</section>

<section class="section rainbow-bg">
  <h2 style="text-align:center"><!-- SLOT: features_section_title --></h2>
  <div class="features">
    <div class="feature-card"><h3><!-- SLOT: feature_1_title --></h3><p><!-- SLOT: feature_1_desc --></p></div>
    <div class="feature-card"><h3><!-- SLOT: feature_2_title --></h3><p><!-- SLOT: feature_2_desc --></p></div>
    <div class="feature-card"><h3><!-- SLOT: feature_3_title --></h3><p><!-- SLOT: feature_3_desc --></p></div>
    <div class="feature-card"><h3><!-- SLOT: feature_4_title --></h3><p><!-- SLOT: feature_4_desc --></p></div>
  </div>
</section>

<section class="section">
  <h2 style="text-align:center"><!-- SLOT: pricing_section_title --></h2>
  <div class="pricing-grid">
    <div class="price-card"><h3><!-- SLOT: plan_1_name --></h3><div class="price"><!-- SLOT: plan_1_price --></div><p style="color:#555"><!-- SLOT: plan_1_desc --></p></div>
    <div class="price-card featured"><h3><!-- SLOT: plan_2_name --></h3><div class="price"><!-- SLOT: plan_2_price --></div><p style="color:#333"><!-- SLOT: plan_2_desc --></p></div>
    <div class="price-card"><h3><!-- SLOT: plan_3_name --></h3><div class="price"><!-- SLOT: plan_3_price --></div><p style="color:#555"><!-- SLOT: plan_3_desc --></p></div>
  </div>
</section>

<section class="section" style="background: #fff;">
  <h2 style="text-align:center"><!-- SLOT: testimonials_section_title --></h2>
  <div class="testimonials">
    <div class="testimonial-card"><p><!-- SLOT: testimonial_1 --></p><cite><!-- SLOT: testimonial_1_author --></cite></div>
    <div class="testimonial-card"><p><!-- SLOT: testimonial_2 --></p><cite><!-- SLOT: testimonial_2_author --></cite></div>
    <div class="testimonial-card"><p><!-- SLOT: testimonial_3 --></p><cite><!-- SLOT: testimonial_3_author --></cite></div>
  </div>
</section>

<footer><!-- SLOT: footer_text --></footer>
</body>
</html>
