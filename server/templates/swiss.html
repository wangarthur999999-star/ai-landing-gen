<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: page_title --></title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff; color: #111; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
  .hero-text {
    padding: clamp(3rem, 8vw, 8rem) clamp(2rem, 6vw, 6rem);
    display: flex; flex-direction: column; justify-content: center;
    background: #fff;
  }
  .hero-visual {
    background: #e11d48; display: flex; align-items: center; justify-content: center;
    padding: 3rem;
  }
  .hero-visual .brand-mark { font-size: clamp(6rem, 12vw, 16rem); font-weight: 900; color: #fff; }
  h1 { font-size: clamp(2.5rem, 5vw, 4rem); font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; margin-bottom: 1.5rem; }
  .subtitle { font-size: 1.25rem; color: #555; margin-bottom: 2rem; max-width: 32rem; }
  .cta {
    display: inline-block; background: #111; color: #fff; padding: 1rem 2.5rem;
    font-size: 1rem; font-weight: 600; text-decoration: none; letter-spacing: 0.02em;
    transition: background 0.2s;
  }
  .cta:hover { background: #e11d48; }
  .section { padding: clamp(3rem, 8vw, 6rem) clamp(2rem, 6vw, 6rem); }
  .section-dark { background: #111; color: #fff; }
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 3rem; }
  .feature h3 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
  .feature p { color: #666; line-height: 1.7; }
  .section-dark .feature p { color: #999; }
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem; }
  .pricing-card { border: 2px solid #e5e5e5; padding: 2.5rem; }
  .pricing-card.featured { border-color: #e11d48; }
  .pricing-card h3 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .pricing-card .price { font-size: 3rem; font-weight: 900; margin: 1rem 0; }
  .testimonial-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 3rem; }
  .testimonial { border-left: 4px solid #e11d48; padding-left: 1.5rem; }
  .testimonial blockquote { font-size: 1.125rem; font-style: italic; color: #444; margin-bottom: 1rem; }
  .testimonial cite { font-weight: 600; font-style: normal; color: #111; }
  footer { padding: 3rem; text-align: center; color: #999; font-size: 0.875rem; border-top: 1px solid #e5e5e5; }
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .hero-visual { min-height: 50vh; }
  }
</style>
</head>
<body>
<div class="grid">
  <div class="hero-text">
    <h1><!-- SLOT: hero_headline --></h1>
    <p class="subtitle"><!-- SLOT: hero_subtitle --></p>
    <div><a href="#" class="cta"><!-- SLOT: cta_text --></a></div>
  </div>
  <div class="hero-visual">
    <div class="brand-mark"><!-- SLOT: brand_initial --></div>
  </div>
</div>

<section class="section">
  <h2 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 3rem; letter-spacing: -0.02em;"><!-- SLOT: features_section_title --></h2>
  <div class="features">
    <div class="feature"><h3><!-- SLOT: feature_1_title --></h3><p><!-- SLOT: feature_1_desc --></p></div>
    <div class="feature"><h3><!-- SLOT: feature_2_title --></h3><p><!-- SLOT: feature_2_desc --></p></div>
    <div class="feature"><h3><!-- SLOT: feature_3_title --></h3><p><!-- SLOT: feature_3_desc --></p></div>
    <div class="feature"><h3><!-- SLOT: feature_4_title --></h3><p><!-- SLOT: feature_4_desc --></p></div>
  </div>
</section>

<section class="section section-dark">
  <h2 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 1rem; letter-spacing: -0.02em;"><!-- SLOT: pricing_section_title --></h2>
  <p style="color: #999; margin-bottom: 2rem;"><!-- SLOT: pricing_subtitle --></p>
  <div class="pricing-grid">
    <div class="pricing-card"><h3><!-- SLOT: plan_1_name --></h3><div class="price"><!-- SLOT: plan_1_price --></div><p style="color:#666"><!-- SLOT: plan_1_desc --></p></div>
    <div class="pricing-card featured"><h3><!-- SLOT: plan_2_name --></h3><div class="price"><!-- SLOT: plan_2_price --></div><p style="color:#666"><!-- SLOT: plan_2_desc --></p></div>
    <div class="pricing-card"><h3><!-- SLOT: plan_3_name --></h3><div class="price"><!-- SLOT: plan_3_price --></div><p style="color:#666"><!-- SLOT: plan_3_desc --></p></div>
  </div>
</section>

<section class="section">
  <h2 style="font-size: 2.5rem; font-weight: 900; margin-bottom: 3rem; letter-spacing: -0.02em;"><!-- SLOT: testimonials_section_title --></h2>
  <div class="testimonial-grid">
    <div class="testimonial"><blockquote><!-- SLOT: testimonial_1 --></blockquote><cite><!-- SLOT: testimonial_1_author --></cite></div>
    <div class="testimonial"><blockquote><!-- SLOT: testimonial_2 --></blockquote><cite><!-- SLOT: testimonial_2_author --></cite></div>
    <div class="testimonial"><blockquote><!-- SLOT: testimonial_3 --></blockquote><cite><!-- SLOT: testimonial_3_author --></cite></div>
  </div>
</section>

<footer>
  <p><!-- SLOT: footer_text --></p>
</footer>
</body>
</html>
