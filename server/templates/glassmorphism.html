<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: page_title --></title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, #0c0c1d 0%, #1a0a2e 30%, #16213e 60%, #0a1628 100%);
    color: #e8e8f0; line-height: 1.6; min-height: 100vh;
  }
  .mesh-bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.3) 0%, transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(0, 180, 255, 0.25) 0%, transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(255, 80, 180, 0.2) 0%, transparent 50%);
  }
  .content { position: relative; z-index: 1; }
  .glass {
    background: rgba(255,255,255,0.06); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
  }
  .hero {
    display: flex; align-items: center; justify-content: center;
    min-height: 90vh; padding: 2rem; text-align: center;
  }
  .hero-card {
    padding: 4rem 3rem; max-width: 48rem;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 32px;
  }
  h1 {
    font-size: clamp(2.5rem, 6vw, 4.5rem); font-weight: 800;
    background: linear-gradient(135deg, #c084fc 0%, #60a5fa 50%, #34d399 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; line-height: 1.1; margin-bottom: 1.5rem;
  }
  .hero-subtitle { font-size: 1.2rem; color: #aab; max-width: 32rem; margin: 0 auto 2rem; }
  .cta {
    display: inline-block; padding: 1rem 2.5rem;
    background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: #fff;
    border-radius: 100px; font-weight: 600; text-decoration: none;
    box-shadow: 0 0 40px rgba(139, 92, 246, 0.3);
    transition: box-shadow 0.3s, transform 0.3s;
  }
  .cta:hover { box-shadow: 0 0 60px rgba(139, 92, 246, 0.5); transform: translateY(-2px); }
  .section { padding: clamp(3rem, 8vw, 6rem) clamp(1.5rem, 5vw, 4rem); position: relative; z-index: 1; }
  .section-title {
    font-size: 2.5rem; font-weight: 700; text-align: center; margin-bottom: 3rem;
    background: linear-gradient(135deg, #e2e8f0, #94a3b8);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
  .feature-card { padding: 2rem; }
  .feature-card .icon { font-size: 2rem; margin-bottom: 1rem; }
  .feature-card h3 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.75rem; color: #fff; }
  .feature-card p { color: #99a; line-height: 1.7; }
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; max-width: 64rem; margin: 0 auto; }
  .price-card { padding: 2.5rem; text-align: center; }
  .price-card.popular { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.3); }
  .price-card h3 { font-size: 1.2rem; color: #aab; margin-bottom: 1rem; }
  .price-card .price { font-size: 3rem; font-weight: 800; margin: 1rem 0; color: #fff; }
  .testimonials { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
  .testimonial-card { padding: 2rem; }
  .testimonial-card p { color: #bbc; font-style: italic; line-height: 1.7; margin-bottom: 1rem; }
  .testimonial-card cite { color: #8b5cf6; font-weight: 600; }
  footer { text-align: center; padding: 3rem 2rem; color: #556; font-size: 0.9rem; position: relative; z-index: 1; border-top: 1px solid rgba(255,255,255,0.06); }
  @media (max-width: 768px) {
    .hero-card { padding: 2rem 1.5rem; }
  }
</style>
</head>
<body>
<div class="mesh-bg"></div>
<div class="content">

<section class="hero">
  <div class="hero-card">
    <h1><!-- SLOT: hero_headline --></h1>
    <p class="hero-subtitle"><!-- SLOT: hero_subtitle --></p>
    <a href="#" class="cta"><!-- SLOT: cta_text --></a>
  </div>
</section>

<section class="section">
  <h2 class="section-title"><!-- SLOT: features_section_title --></h2>
  <div class="features-grid">
    <div class="feature-card glass"><h3><!-- SLOT: feature_1_title --></h3><p><!-- SLOT: feature_1_desc --></p></div>
    <div class="feature-card glass"><h3><!-- SLOT: feature_2_title --></h3><p><!-- SLOT: feature_2_desc --></p></div>
    <div class="feature-card glass"><h3><!-- SLOT: feature_3_title --></h3><p><!-- SLOT: feature_3_desc --></p></div>
    <div class="feature-card glass"><h3><!-- SLOT: feature_4_title --></h3><p><!-- SLOT: feature_4_desc --></p></div>
  </div>
</section>

<section class="section">
  <h2 class="section-title"><!-- SLOT: pricing_section_title --></h2>
  <div class="pricing-grid">
    <div class="price-card glass"><h3><!-- SLOT: plan_1_name --></h3><div class="price"><!-- SLOT: plan_1_price --></div><p style="color:#99a"><!-- SLOT: plan_1_desc --></p></div>
    <div class="price-card glass popular"><h3><!-- SLOT: plan_2_name --></h3><div class="price"><!-- SLOT: plan_2_price --></div><p style="color:#99a"><!-- SLOT: plan_2_desc --></p></div>
    <div class="price-card glass"><h3><!-- SLOT: plan_3_name --></h3><div class="price"><!-- SLOT: plan_3_price --></div><p style="color:#99a"><!-- SLOT: plan_3_desc --></p></div>
  </div>
</section>

<section class="section">
  <h2 class="section-title"><!-- SLOT: testimonials_section_title --></h2>
  <div class="testimonials">
    <div class="testimonial-card glass"><p><!-- SLOT: testimonial_1 --></p><cite><!-- SLOT: testimonial_1_author --></cite></div>
    <div class="testimonial-card glass"><p><!-- SLOT: testimonial_2 --></p><cite><!-- SLOT: testimonial_2_author --></cite></div>
    <div class="testimonial-card glass"><p><!-- SLOT: testimonial_3 --></p><cite><!-- SLOT: testimonial_3_author --></cite></div>
  </div>
</section>

<footer><!-- SLOT: footer_text --></footer>

</div>
</body>
</html>
