<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- SLOT: page_title --></title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0a; color: #d4af37;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Playfair Display', serif; }
  .gold-line { width: 60px; height: 2px; background: #d4af37; margin: 2rem 0; }
  .hero {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 2rem;
    background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 70%);
  }
  .hero h1 { font-size: clamp(3rem, 7vw, 6rem); font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; }
  .hero p { font-size: 1.25rem; color: #999; max-width: 36rem; margin: 2rem auto; font-weight: 300; }
  .cta {
    display: inline-block; border: 1px solid #d4af37; color: #d4af37; padding: 1rem 3rem;
    font-size: 0.875rem; text-decoration: none; letter-spacing: 0.15em; text-transform: uppercase;
    transition: all 0.3s;
  }
  .cta:hover { background: #d4af37; color: #0a0a0a; }
  .section { padding: clamp(4rem, 10vw, 8rem) clamp(2rem, 8vw, 8rem); }
  .section-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; color: #d4af37; margin-bottom: 1rem; }
  .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 4rem; margin-top: 4rem; }
  .feature-item { border-top: 1px solid #222; padding-top: 2rem; }
  .feature-item h3 { font-size: 1.75rem; color: #fff; margin-bottom: 1rem; }
  .feature-item p { color: #777; line-height: 1.8; }
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1px; background: #222; margin-top: 4rem; }
  .price-card { background: #0a0a0a; padding: 3rem 2rem; text-align: center; }
  .price-card.featured { background: #111; }
  .price-card h3 { color: #fff; font-size: 1.25rem; margin-bottom: 1.5rem; }
  .price-card .amount { font-size: 3.5rem; font-weight: 900; font-family: 'Playfair Display', serif; }
  .testimonial-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 3rem; margin-top: 4rem; }
  .testimonial-item { padding: 2rem; border: 1px solid #222; }
  .testimonial-item p { color: #999; font-style: italic; line-height: 1.8; margin-bottom: 1.5rem; }
  .testimonial-item cite { color: #d4af37; font-style: normal; font-weight: 500; }
  footer { padding: 4rem 2rem; text-align: center; border-top: 1px solid #222; color: #555; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
  @media (max-width: 768px) {
    .hero h1 { font-size: 2.5rem; }
  }
</style>
</head>
<body>
<section class="hero">
  <div>
    <h1><!-- SLOT: hero_headline --></h1>
    <p><!-- SLOT: hero_subtitle --></p>
    <a href="#" class="cta"><!-- SLOT: cta_text --></a>
  </div>
</section>

<section class="section">
  <div class="section-label"><!-- SLOT: features_section_label --></div>
  <h2 style="font-size: 3rem; font-weight: 700; color: #fff; line-height: 1.15;"><!-- SLOT: features_section_title --></h2>
  <div class="gold-line"></div>
  <div class="features-grid">
    <div class="feature-item"><h3><!-- SLOT: feature_1_title --></h3><p><!-- SLOT: feature_1_desc --></p></div>
    <div class="feature-item"><h3><!-- SLOT: feature_2_title --></h3><p><!-- SLOT: feature_2_desc --></p></div>
    <div class="feature-item"><h3><!-- SLOT: feature_3_title --></h3><p><!-- SLOT: feature_3_desc --></p></div>
  </div>
</section>

<section class="section" style="background: #050505;">
  <div class="section-label"><!-- SLOT: pricing_section_label --></div>
  <h2 style="font-size: 3rem; font-weight: 700; color: #fff; line-height: 1.15; text-align: center;"><!-- SLOT: pricing_section_title --></h2>
  <div class="gold-line" style="margin: 2rem auto;"></div>
  <div class="pricing-grid">
    <div class="price-card"><h3><!-- SLOT: plan_1_name --></h3><div class="amount"><!-- SLOT: plan_1_price --></div><p style="color:#666; margin-top:1rem"><!-- SLOT: plan_1_desc --></p></div>
    <div class="price-card featured"><h3><!-- SLOT: plan_2_name --></h3><div class="amount"><!-- SLOT: plan_2_price --></div><p style="color:#666; margin-top:1rem"><!-- SLOT: plan_2_desc --></p></div>
    <div class="price-card"><h3><!-- SLOT: plan_3_name --></h3><div class="amount"><!-- SLOT: plan_3_price --></div><p style="color:#666; margin-top:1rem"><!-- SLOT: plan_3_desc --></p></div>
  </div>
</section>

<section class="section">
  <h2 style="font-size: 3rem; font-weight: 700; color: #fff; line-height: 1.15; text-align: center;"><!-- SLOT: testimonials_section_title --></h2>
  <div class="testimonial-grid">
    <div class="testimonial-item"><p><!-- SLOT: testimonial_1 --></p><cite><!-- SLOT: testimonial_1_author --></cite></div>
    <div class="testimonial-item"><p><!-- SLOT: testimonial_2 --></p><cite><!-- SLOT: testimonial_2_author --></cite></div>
  </div>
</section>

<footer><!-- SLOT: footer_text --></footer>
</body>
</html>
